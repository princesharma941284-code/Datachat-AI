name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check that all files compile
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Benchmark self-check (no API key needed)
        run: python -m benchmark.run_benchmark --mock --min-accuracy 100 --out benchmark/results_mock

      - name: Upload mock benchmark chart
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-mock
          path: benchmark/results_mock/
